<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="MySQL Tester">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B5BD7"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>

  <!-- Database cylinder. -->
  <g fill="#F8FAFC">
    <path d="M307 296 v372 a205 64 0 0 0 410 0 v-372 z"/>
    <ellipse cx="512" cy="296" rx="205" ry="64"/>
  </g>

  <!-- Latency trace. It doubles as the disc divider, so the cylinder needs no
       separator arc of its own. The dark casing keeps it legible on the white. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M148 512 H356 l42 -92 l54 184 l44 -128 l38 66 H876" stroke="#16244A" stroke-width="54"/>
    <path d="M148 512 H356 l42 -92 l54 184 l44 -128 l38 66 H876" stroke="#37E0C4" stroke-width="24"/>
  </g>
</svg>
